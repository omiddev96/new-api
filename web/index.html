<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="google" content="notranslate" />
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta property="og:title" content="جت کلاد API" />
    <meta
      property="og:description"
      content="بهترین مدل‌های هوش مصنوعی با یک کلید. شارژ ریالی."
    />
    <meta property="og:image" content="/og-image.png" />
    <meta property="og:type" content="website" />

    <!-- Primary Meta Tags -->
    <title>جت کلاد API</title>
    <meta name="title" content="جت کلاد API" />
    <meta
      name="description"
      content="درگاه یکپارچه API هوش مصنوعی جت کلاد و پیشخوان مدیریت."
    />

    <meta name="theme-color" content="#07060f" />
    <!-- Resolve locale direction and the theme before first paint so the page
         never flashes LTR or the wrong color. Keep the theme half in sync with
         ThemeProvider and THEME_STORAGE_KEYS.mode. -->
    <script>
      ;(function () {
        var lng = 'fa'
        try {
          lng = localStorage.getItem('i18nextLng') || 'fa'
        } catch (e) {}
        var persian = lng === 'fa' || lng.indexOf('fa-') === 0
        document.documentElement.lang = persian ? 'fa' : lng
        document.documentElement.dir = persian ? 'rtl' : 'ltr'

        var theme = 'system'
        try {
          theme = localStorage.getItem('newapi:theme:v1:mode') || 'system'
        } catch (e) {}
        if (theme !== 'dark' && theme !== 'light') {
          theme = window.matchMedia('(prefers-color-scheme: dark)').matches
            ? 'dark'
            : 'light'
        }
        document.documentElement.classList.add(theme)
      })()
    </script>
    <!--umami-->
    <!--Google Analytics-->
  </head>

  <body>
    <div id="root" translate="no" class="notranslate"></div>
  </body>
</html>
